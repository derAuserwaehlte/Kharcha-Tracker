<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kharcha Tracker</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1{
      color: #2c3e50;
      text-align: center;
      
    }
    .form{
      background:white;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap:10px;
    }
    input, select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;

    }
    button{
      padding: 10px;
      background-color: #2ecc71;
      color:white;
      border:none;
      border-radius:6px;
      font-size:16px;
      cursor:pointer;    
    }

    ul{
      list-style: none;
      padding: 0;
    }
    li{
      background:white;
      padding:12px;
      margin-top:8px;
      border-radius:6px;
      border-left: 4px solid #2ecc71;
    }
    h3{
      text-align:center;
      color:#e74c3c;
    }
    .deleteBtn{
      background-color: #e74c3c;
      padding: 2px 8px;
      font-size:12px;
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <h1>Mero Kharcha</h1>
  <div class="form">
    <input type="text" id="expenseName" placeholder="K kharcha? (eg. Date, petrol)"/>
    <input type="number" id="expenseAmount" placeholder="Kati ko fatkyo?">
    <select id="expenseCategory">
      <option value="khana">Khana</option>
      <option value="yatayat">Yatayat</option>
      <option value="bijuli">Bijuli</option>
      <option value="manoranjan">Manoranjan</option>
      <option value="anya">Anya</option>
    </select>
    <button id="addBtn">Add Kharcha</button>

  </div>
  <ul id="expenseList"></ul>
  <h3 id="total">Jamma Kharcha: NPR 0</h3>
  <script>
  let totalAmount = 0;

  document.getElementById("addBtn").onclick = function() {
    let name = document.getElementById("expenseName").value;
    let amount = document.getElementById("expenseAmount").value;
    let category = document.getElementById("expenseCategory").value;

    if(name == "" || amount == "") {
      alert("Sabai field bharnus!")
      return;
    }

    let li = document.createElement("li");
    li.textContent = category + " - " + name + ": NPR " + amount;
    document.getElementById("expenseList").appendChild(li);

    let deleteBtn = document.createElement("button");
    deleteBtn.textContent = "X";
    deleteBtn.classList.add("deleteBtn");
    deleteBtn.onclick=function(){
      li.remove();
      totalAmount= totalAmount- Number(amount);
      document.getElementById("total").textContent = "Jamma Kharcha: NPR" + totalAmount;
    }
    li.appendChild(deleteBtn);

    totalAmount = totalAmount + Number(amount);
    document.getElementById("total").textContent = "Jamma Kharcha: NPR " + totalAmount;
  }
</script>
</body>
</html>
